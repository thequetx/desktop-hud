# Desktop HUD: test, build and (on a version tag) draft a release.
# Phase 9.6, trust model S4 (updates and the supply chain):
# - actions are pinned to commit SHAs, not tags that can move;
# - the workflow token is read-only except for the one job that drafts a
#   release, and only on a v* tag;
# - the build is the public one: `npm run dist:public` refuses to run with the
#   private add-ons linked, runs the smoke test, and runs release:check strict
#   (generic patterns, plus the owner's personal list from a repository secret
#   that is never printed);
# - a release is a draft until a person reviews and publishes it.

name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
          # npm 11 holds back install scripts; these two are needed to build.
          node node_modules/esbuild/install.js
          if ($LASTEXITCODE -ne 0) { throw "esbuild install failed with exit code $LASTEXITCODE" }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw "Electron install failed with exit code $LASTEXITCODE" }

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Nothing personal in the tracked source
        env:
          RELEASE_CHECK_PERSONAL: ${{ secrets.RELEASE_CHECK_PERSONAL }}
        run: |
          $releaseCheckArgs = @('--source')
          if ('${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true') { $releaseCheckArgs += '--require-personal' }
          node scripts/release-check.mjs @releaseCheckArgs
          if ($LASTEXITCODE -ne 0) { throw "Source release check failed with exit code $LASTEXITCODE" }

      - name: Third-party notices current
        run: |
          node scripts/notices.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "Third-party notices check failed with exit code $LASTEXITCODE" }

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Public build (smoke test and strict release check included)
        env:
          RELEASE_CHECK_PERSONAL: ${{ secrets.RELEASE_CHECK_PERSONAL }}
        run: npm run dist:public

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-hud-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A protected environment: give it required reviewers in the repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-hud-${{ github.sha }}
          path: dist-release
      - name: Draft the release (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Desktop HUD $TAG" \
            --notes "Draft built by CI from ${GITHUB_SHA}. Check SHA256SUMS.txt against the files before publishing."
